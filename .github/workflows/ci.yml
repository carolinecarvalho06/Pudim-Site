name: Docker CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Job 1: Constrói a imagem e faz o upload para o Docker Hub
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Autenticação no Docker Hub usando as Secrets cadastradas
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Build e Push da imagem com a sua conta no Docker Hub
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/pudim-site:latest

  # Job 2: Baixa a imagem do Docker Hub e executa os testes dentro do container
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Rodar verificação dentro do Container
        run: docker run ${{ secrets.DOCKER_USER }}/pudim-site:latest nginx -t

  # Job 3: Deploy na VM Azure via SSH
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Implantar na VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USER }}/pudim-site:latest
            docker rm -f pudim-site || true
            docker run -d --name pudim-site -p 8076:80 --restart unless-stopped ${{ secrets.DOCKER_USER }}/pudim-site:latest